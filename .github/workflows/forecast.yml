name: forecast-dashboard

# クラウド(GitHub)上で定期実行する。あなたのPCの電源状態に依存しない。
on:
  workflow_dispatch:           # cron-job.org または Actionsタブから手動実行

permissions:
  contents: write              # 生成物を同じリポジトリに push するため

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 日本語フォント(チャートの文字化け防止)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存インストール
        run: pip install -r requirements.txt

      - name: 予測を取得 (Open-Meteo -> wind.db)
        run: python collect_forecasts.py

      - name: バイアス補正データをプライベートリポジトリから取得
        env:
          TOKEN: ${{ secrets.PRIVATE_WIND_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            curl -fsSL \
              -H "Authorization: token $TOKEN" \
              "https://raw.githubusercontent.com/makoaso-sys/wind/main/ushibuse-wind/calibration.json" \
              -o calibration.json \
              && echo "calibration.json を取得しました" \
              || echo "calibration.json の取得に失敗しました（補正なしで実行）"
          else
            echo "PRIVATE_WIND_TOKEN が未設定のため補正なしで実行"
          fi

      - name: 観測データをプライベートリポジトリから取得 (実測オーバーレイ用)
        env:
          TOKEN: ${{ secrets.PRIVATE_WIND_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            curl -fsSL \
              -H "Authorization: token $TOKEN" \
              "https://raw.githubusercontent.com/makoaso-sys/wind/main/ushibuse-wind/observations.db" \
              -o observations.db \
              && echo "observations.db を取得しました（直近12hの実測を重ねる）" \
              || echo "observations.db の取得に失敗しました（実測オーバーレイなしで実行）"
          else
            echo "PRIVATE_WIND_TOKEN が未設定のため実測オーバーレイなしで実行"
          fi

      - name: ダッシュボード生成 (docs/index.html, docs/forecast.png)
        run: python generate_dashboard.py

      # ── 走れそうなら ntfy でスマホ通知 ──
      # Secrets の NTFY_TOPIC でトピックを差し替えられる。未設定なら
      # notify.py の既定トピックを使う(空文字を渡しても既定に落ちる)。
      # 重複抑止の notify_log は wind.db に書かれるので、次の commit で永続化される。
      - name: 通知 (出走できそうなら ntfy)
        run: python notify.py --topic "${{ secrets.NTFY_TOPIC }}"

      - name: コミット & プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs wind.db
          git commit -m "update forecast $(date -u +%FT%TZ)" || echo "no changes"
          git push

      # ── 限定公開への移行 Phase 1: Cloudflare Pages にも同じ docs/ を配る ──
      # 目的は「並行運用」。GitHub Pages は従来どおり更新し続けたまま、同一の
      # 生成物を Cloudflare にも出す。閲覧制限(Cloudflare Access)を当てるのは
      # Phase 2 なので、この時点では両者は内容もアクセス性も同じ。
      # 手順と切り替え計画は Privateリポ(makoaso-sys/wind)の
      # CLOUDFLARE_MIGRATION.md を参照。
      #
      # 「コミット & プッシュ」の後ろに置くこと。移行先が落ちても、現行の公開先
      # である GitHub Pages の更新を巻き添えにしない。
      #
      # Secrets 未設定なら何もせず素通りする。Cloudflare 側の準備が整うまで、
      # このワークフローの挙動は一切変わらない。
      - name: "Cloudflare Pages へデプロイ (Phase 1: GitHub Pages と並行)"
        id: cfpages
        # continue-on-error: 移行作業中の失敗で、本番の更新ジョブを赤くしない。
        # 実際の失敗は下の outcome 判定で拾う。
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare の Secrets が未設定のためスキップ (Phase 1 未開始)"
            exit 0
          fi
          # --branch: プロジェクトの本番ブランチと一致させる。ここを外すと
          # プレビュー配置になり、本番URLが更新されない。
          npx --yes wrangler@4 pages deploy docs \
            --project-name=ushibuse-wind \
            --branch=main \
            --commit-dirty=true

      # continue-on-error はステップの結論を success に書き換えるので、
      # outcome を見ないと失敗に気付けない (fetch-obs.yml と同じ扱い)。
      - name: Cloudflare へのデプロイに失敗していたら警告する
        if: steps.cfpages.outcome == 'failure'
        run: |
          echo "::warning title=Cloudflare Pages へのデプロイに失敗::" \
               "現行の GitHub Pages は正常に更新済み。Cloudflare 側だけ前回のまま。"
          echo "### ⚠ Cloudflare Pages へのデプロイに失敗" >> "$GITHUB_STEP_SUMMARY"
          echo "現行の公開先(GitHub Pages)は正常に更新済み。移行先だけ前回のまま。" \
               >> "$GITHUB_STEP_SUMMARY"
